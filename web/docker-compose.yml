services:
  mongodb:
    image: mongo:7.0
    container_name: jyotirai-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - jyotirai-network

  backend:
    build:
      # Context is the repo root so the image can vendor the jhora library `src/`
      # (astrology.py imports jhora from ../../src). See web/backend/Dockerfile.
      context: ..
      dockerfile: web/backend/Dockerfile
    container_name: jyotirai-backend
    environment:
      MONGODB_URL: mongodb://admin:admin123@mongodb:27017
      DATABASE_NAME: jyotirai_db
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Local AI (Ollama). Point at the host's Ollama; from inside the container
      # "localhost" is the container itself, so use host.docker.internal / LAN IP.
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_DEFAULT_MODEL: qwen2.5:14b
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
      # Sign in with Google (optional). Interpolated from web/.env; empty = disabled.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    networks:
      - jyotirai-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jyotirai-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_API_TIMEOUT: 30000
      # Must match the backend GOOGLE_CLIENT_ID. Interpolated from web/.env.
      REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - jyotirai-network
    command: npm start

volumes:
  mongodb_data:

networks:
  jyotirai-network:
    driver: bridge
