# Single-origin reverse proxy for the NAS deployment.
#
#   Cloudflare edge (SSL) ─► cloudflared tunnel ─► this nginx (:80, plain HTTP)
#                                                      ├── /api/*, /health ─► backend:8000
#                                                      └── everything else  ─► static SPA
#
# Because the app and the API share one origin here, the frontend is built with
# REACT_APP_API_URL="" and calls "/api/..." relative — no CORS, no ports exposed.

server {
    listen 80;
    server_name _;

    # Allow large birth-data / AI payloads.
    client_max_body_size 20m;

    # ---- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS and forwards this header; the app builds
        # absolute email links from APP_BASE_URL so this is mostly informational.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Server-Sent Events (/api/astrology/ask/stream) and long LLM calls:
        # never buffer, and give generations plenty of time.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # ---- Static SPA ---------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted build assets. Safe because every deploy gives
    # them new hashed filenames.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html and the service worker must NEVER be cached. index.html is the
    # only thing that names the current hashed bundles, so a stale copy pins a
    # browser to the previous build's JavaScript — indefinitely, across new tabs,
    # because nginx sends no Cache-Control here by default and the browser is then
    # free to reuse it on heuristic freshness.
    #
    # That is not a hypothetical: an old bundle talking to the current API drew
    # every chart with the house number in place of the rasi number, because the
    # key it read (`lagna.house`) had changed meaning under it (todo.md §66).
    # A stale client fails *plausibly*, which is the worst way to fail.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
